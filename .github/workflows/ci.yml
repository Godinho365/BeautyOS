name: CI

# Pipeline de integração contínua do BeautyOS.
# Hoje: lint da documentação (docs-as-code) + placeholder de testes.
# À medida que o backend/frontend/mobile nascerem, novos jobs entram aqui.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-lint:
    name: Lint de documentação (docs-as-code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar docs (links, fences, frontmatter)
        run: python scripts/validate_docs.py

  tests:
    name: Testes (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Placeholder até o backend existir. Quando houver testes (pytest/DRF),
      # substituir por: setup-python -> pip install -r requirements.txt -> pytest.
      # Falha propositalmente NÃO ocorre aqui ainda; o gate real de testes entra
      # junto do primeiro módulo (walking skeleton multi-tenant).
      - name: Nenhum teste ainda
        run: echo "Sem suíte de testes ainda. Ver docs/testing/testing-strategy.md."
